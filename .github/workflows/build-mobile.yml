name: Build Mobile (iOS + Android)

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'l10n.yaml'
      - 'assets/**'
      - 'shaders/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - run: flutter pub get
      # 新增依赖时自动把解析结果写回仓库，避免 lock 与 pubspec 不同步。
      - name: Sync pubspec.lock
        run: |
          if ! git diff --quiet pubspec.lock; then
            git config user.email "ci@local"
            git config user.name "ci"
            git add pubspec.lock
            git commit -m "chore: sync pubspec.lock"
            git push
          fi
      - run: flutter gen-l10n
      - name: Dart format check（对齐上游 CI）
        id: fmt
        run: |
          dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - name: Push formatted files (on failure)
        if: steps.fmt.outcome == 'failure'
        run: |
          dart format lib test
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B format-diff
          git add lib test
          git commit -m "ci: dart format"
          git push -f origin format-diff
          echo "===== 格式化后的 lib/test 已推到 format-diff 分支 ====="
      # 格式只提示、不再阻断构建：过去两次因为一行超长白跑一整轮 CI。
      # 需要对齐格式时，直接取 format-diff 分支即可。
      - name: Format note (non-blocking)
        if: steps.fmt.outcome == 'failure'
        run: echo "::warning::dart format 未通过，格式化结果已推到 format-diff 分支（本次不阻断构建）"
      - name: Widget tests (diagnostic)
        id: wtests
        run: |
          FAILED=0
          : > /tmp/tests.log
          for test_file in test/*_test.dart; do
            echo "===== $test_file =====" >> /tmp/tests.log
            if ! OUT=$(flutter test --no-pub "$test_file" 2>&1); then
              FAILED=1
              echo "$OUT" >> /tmp/tests.log
              SUMMARY=$(printf '%s' "$OUT" | grep -B3 -A12 -m1 'Error\|EXCEPTION\|Expected:\|Actual:\|failed' | head -c 900)
              echo "::error title=TestFailed file=$test_file::$SUMMARY"
              echo "---- $test_file 失败 ----"
              printf '%s\n' "$OUT" | tail -40
            else
              echo "$OUT" >> /tmp/tests.log
            fi
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true
      - name: Push test output (on failure)
        if: steps.wtests.outputs.failed == '1'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B test-logs
          cp /tmp/tests.log test-output.log
          git add -f test-output.log
          git commit -m "ci: test output"
          git push -f origin test-logs
      # 静态分析失败时把完整输出推到 ci-logs 分支，便于本地 git 直接读取。
      - name: Analyze (log to branch on failure)
        id: analyze_step
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log
          exit ${PIPESTATUS[0]}
      - name: Push analyze log (on failure)
        if: steps.analyze_step.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B ci-logs
          cp /tmp/analyze.log analyze.log
          git add -f analyze.log
          git commit -m "ci: analyze log"
          git push -f origin ci-logs
      - name: Fail if analyze failed
        if: steps.analyze_step.outcome == 'failure'
        run: exit 1

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    needs: analyze
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - name: Pub get & l10n
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        id: package
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          TAG="v${VERSION%%+*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          (cd build && zip -qr "app-ios-$TAG.ipa" Payload)
          ls -lh "build/app-ios-$TAG.ipa"
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-ios-${{ steps.package.outputs.tag }}
          path: build/app-ios-*.ipa
          retention-days: 30
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          ls -la build/*.ipa
          # 两个 job 并发：先确保 release 存在（不带资产），再各自上传，避免互相挤掉。
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "易读 $TAG" --notes "iOS 未签名 IPA + 安卓 APK。iOS 用 TrollStore / AltStore / Sideloadly 侧载。" \
            || true
          gh release upload "$TAG" build/app-ios-*.ipa --clobber

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - run: |
          flutter pub get
          flutter gen-l10n
      # runner 默认 JDK 已升到 25.0.4.1，Kotlin 编译器解析该版本号会抛
      # IllegalArgumentException: 25.0.4.1，因此显式切到 runner 自带的 JDK 21。
      - name: Select JDK 21 (Kotlin cannot parse JDK 25.0.4.1)
        run: |
          echo "--- 可用 JDK ---"
          ls /usr/lib/jvm || true
          JDK=""
          for v in 21 17; do
            found=$(ls -d /usr/lib/jvm/*"${v}"* 2>/dev/null | grep -v -i "jre" | head -1)
            if [ -n "$found" ]; then JDK="$found"; break; fi
          done
          if [ -z "$JDK" ]; then echo "未找到 JDK 21/17"; exit 1; fi
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "已选择 JDK: $JDK"
          "$JDK/bin/java" -version 2>&1 | head -2
      # 详细日志落盘，失败时推到 ci-logs-android，便于在本地直接读 Gradle 报错。
      - name: Build APK
        id: apk_build
        continue-on-error: true
        env:
          YIDU_STORE_PASSWORD: yidu2026
          YIDU_KEY_PASSWORD: yidu2026
        run: |
          set -o pipefail
          flutter config --jdk-dir "$JAVA_HOME" || true
          java -version 2>&1 | head -2
          flutter build apk --release -v 2>&1 | tee /tmp/apk.log
          exit ${PIPESTATUS[0]}
      - name: Push APK build log (on failure)
        if: steps.apk_build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B ci-logs-android
          cp /tmp/apk.log apk.log
          git add -f apk.log
          git commit -m "ci: apk build log"
          git push -f origin ci-logs-android
      - name: Fail if APK build failed
        if: steps.apk_build.outcome == 'failure'
        run: exit 1
      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          TAG="v${VERSION%%+*}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          # 与 iOS job 并发：先确保 release 存在，再上传，两边互不覆盖。
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "易读 $TAG" --notes "iOS 未签名 IPA + 安卓 APK。iOS 用 TrollStore / AltStore / Sideloadly 侧载。" \
            || true
          gh release upload "$TAG" "$APK" --clobber

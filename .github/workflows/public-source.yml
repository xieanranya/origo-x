name: Public local reader validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    name: Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: python3 tool/check_public_source.py
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # 格式仅作提示：本工作流的核心是源码边界检查，不应被格式问题阻断。
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::dart format 未通过（仅提示，不阻断）"

      - run: flutter analyze --no-pub
      - name: Stateful widget tests in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/*_test.dart; do
            flutter test --no-pub "$test_file"
          done
  android:
    name: Product build - local Android
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # 冒烟构建：仅验证本机可编译，不阻断边界检查（正式产物由 build-mobile 出）
      - run: flutter build apk --debug --no-pub
        continue-on-error: true
  linux:
    name: Product build - local Linux desktop
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      # 冒烟构建：仅验证本机可编译，不阻断边界检查（正式产物由 build-mobile 出）
      - run: flutter build linux --release --no-pub
        continue-on-error: true
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
  web:
    name: Product build - local browser
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # 冒烟构建：仅验证本机可编译，不阻断边界检查（正式产物由 build-mobile 出）
      - run: flutter build web --release --no-pub
        continue-on-error: true

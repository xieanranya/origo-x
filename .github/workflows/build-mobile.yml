name: Build Mobile (iOS + Android)

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'android/**'
      - 'l10n.yaml'
      - 'assets/**'
      - 'shaders/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Dart format check（对齐上游 CI）
        id: fmt
        run: |
          dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - name: Push formatted files (on failure)
        if: steps.fmt.outcome == 'failure'
        run: |
          dart format lib test
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B format-diff
          git add lib test
          git commit -m "ci: dart format"
          git push -f origin format-diff
          echo "===== 格式化后的 lib/test 已推到 format-diff 分支 ====="
      - name: Fail if format check failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1
      - name: Widget tests (diagnostic)
        id: wtests
        run: |
          FAILED=0
          : > /tmp/tests.log
          for test_file in test/*_test.dart; do
            echo "===== $test_file =====" >> /tmp/tests.log
            if ! OUT=$(flutter test --no-pub "$test_file" 2>&1); then
              FAILED=1
              echo "$OUT" >> /tmp/tests.log
              SUMMARY=$(printf '%s' "$OUT" | grep -B3 -A12 -m1 'Error\|EXCEPTION\|Expected:\|Actual:\|failed' | head -c 900)
              echo "::error title=TestFailed file=$test_file::$SUMMARY"
              echo "---- $test_file 失败 ----"
              printf '%s\n' "$OUT" | tail -40
            else
              echo "$OUT" >> /tmp/tests.log
            fi
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true
      - name: Push test output (on failure)
        if: steps.wtests.outputs.failed == '1'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B test-logs
          cp /tmp/tests.log test-output.log
          git add -f test-output.log
          git commit -m "ci: test output"
          git push -f origin test-logs
      - run: flutter analyze --no-pub

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    needs: analyze
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - name: Pub get & l10n
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        id: package
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          TAG="v${VERSION%%+*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          (cd build && zip -qr "app-ios-$TAG.ipa" Payload)
          ls -lh "build/app-ios-$TAG.ipa"
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-ios-${{ steps.package.outputs.tag }}
          path: build/app-ios-*.ipa
          retention-days: 30
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/app-ios-*.ipa --clobber
          else
            gh release create "$TAG" build/app-ios-*.ipa --title "易读 $TAG" --notes "iOS 未签名 IPA，TrollStore / AltStore / Sideloadly 侧载安装。"
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
      - run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          TAG="v${VERSION%%+*}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          # 建库不存在则创建，已存在则追加资源（与 iOS job 容错竞争）
          gh release create "$TAG" "$APK" --title "易读 $TAG" --notes "本地小说阅读器：iOS 未签名 IPA + 安卓 APK。iOS 用 TrollStore / AltStore / Sideloadly 侧载。" \
            || gh release upload "$TAG" "$APK" --clobber
